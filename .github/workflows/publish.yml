# Builds, tests and publishes gitSt8 to the VS Code Marketplace.
#
# Release: bump "version" in package.json, commit, then push a matching tag:
#   git tag v0.0.3 && git push origin v0.0.3
# Manual run (Actions tab → "Publish extension" → Run workflow) builds the .vsix only,
# unless "publish" is ticked.
#
# Publishing uses Microsoft Entra ID instead of a personal access token: GitHub's OIDC token is
# exchanged for an Azure token of a managed identity that is a member of the Marketplace publisher.
# Needs the GitHub environment "marketplace" with the variables AZURE_CLIENT_ID and AZURE_TENANT_ID
# (and optionally AZURE_SUBSCRIPTION_ID). Setup: see "Releasing" in README.md.

name: Publish extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Marketplace (otherwise only build the .vsix)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Check release metadata
        if: github.event_name == 'push' || inputs.publish
        run: |
          node -e '
            const p = require("./package.json");
            const errors = [];
            if (!p.publisher || p.publisher === "local") errors.push("package.json: set \"publisher\" to your Marketplace publisher ID");
            if (!p.repository) errors.push("package.json: add a \"repository\" field");
            const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : null;
            if (tag && tag !== "v" + p.version) errors.push(`tag ${tag} does not match package.json version ${p.version}`);
            errors.forEach(e => console.log("::error::" + e));
            process.exit(errors.length ? 1 : 0);
          '

      - name: Package
        id: package
        run: |
          VSIX="gitst8-$(node -p "require('./package.json').version").vsix"
          # Relative links and images in README.md point at this commit on GitHub.
          npx vsce package --out "$VSIX" \
            --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" \
            --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # The Azure federated credential trusts only jobs in this environment.
    environment: marketplace
    permissions:
      contents: write # create the GitHub release
      id-token: write # request the OIDC token for the Azure login
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Sign in to Azure (workload identity federation, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # The Marketplace member ID of the identity. Add it to the publisher once (see README).
      - name: Show identity
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query "{id: id, name: displayName}" -o table

      # Publishes the exact file that was tested and packaged by the build job.
      - name: Publish to the Marketplace
        run: npx vsce publish --azure-credential --packagePath "${{ needs.build.outputs.vsix }}"

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.vsix }}" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
